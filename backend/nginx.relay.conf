# /etc/nginx/sites-available/relay.saltleak.com
# proxy ke Go backend di 127.0.0.1:8080

server {
    listen 80;
    server_name relay.saltleak.com;

    # Certbot akan menambahkan blok 443 + redirect otomatis
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket/long-lived support (tidak dipakai sekarang, aman)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
